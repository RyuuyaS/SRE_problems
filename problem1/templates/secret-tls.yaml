{{- if .Values.tls.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "docker-registry.fullname" . }}-tls
  labels:
    {{ include "docker-registry.labels" . | nindent 4 }}
type: Opaque
data:
  cert.pem: {{ .Values.tls.cert | b64enc }}
  key.pem: {{ .Values.tls.key | b64enc }}
{{- end }}
