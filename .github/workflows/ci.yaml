name: Lint Chart

on:
  push:
    branches:
      - main
    paths:
      - "problem1/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Lint
        run: helm lint .

      - name: Setup Minikube (action)
        uses: manusa/actions-setup-minikube@v2.4.0
        with:
          minikube-version: "1.30.1" # you may change version as needed
          kubectl-version: "stable"
          driver: docker
          start-args: "--ports=5000:5000"

      - name: Test self host registry
        run: |
          docker login localhost:5000 -u admin -p demo12345
