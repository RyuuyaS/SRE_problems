name: Lint Chart

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "problem1/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Lint
        run: helm lint problem1

      - name: Setup Minikube (action)
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker
          start-args: "--ports=5000:32700"

      - name: Helm install
        working-directory: problem1
        run: |
          helm install docker-registry . -f values.yaml

      - name: Test self host registry
        run: |
          sleep 30
          docker login localhost:5000 -u admin -p demo12345
